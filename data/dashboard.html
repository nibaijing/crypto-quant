<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CryptoQuant · Live</title>
<style>
/* ========== Reset & Variables ========== */
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e14;--bg-panel:#0f1419;--border:#1a2332;--text:#bfbdb6;--text-dim:#5c6773;--text-bright:#e6e1cf;--green:#7fd962;--red:#f26d78;--blue:#59c2ff;--yellow:#ffb454;--cyan:#95e6cb;--pink:#d2a6ff;--orange:#ff8f40;--mono:'Fira Code','Cascadia Mono','JetBrains Mono','Consolas',monospace;--radius:8px}

body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;line-height:1.5;min-height:100vh}

.container{max-width:960px;margin:0 auto;padding:8px}

.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}
.cyan{color:var(--cyan)}.yellow{color:var(--yellow)}.dim{color:var(--text-dim)}

/* ========== Header ========== */
.header{border-bottom:1px solid var(--border);padding:10px 0 12px;margin-bottom:10px}
.h-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px}
.title{color:var(--cyan);font-size:15px;font-weight:700;letter-spacing:1px}
.title .dim{color:var(--text-dim);font-weight:400;font-size:11px}
.status-line{color:var(--text-dim);font-size:10px;margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px}

.badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:600}
.badge-live{background:rgba(127,217,98,0.12);color:var(--green)}
.badge-sim{background:rgba(255,180,84,0.12);color:var(--yellow)}
.badge-off{background:rgba(242,109,120,0.12);color:var(--red)}

.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px;animation:blink 1.5s infinite;vertical-align:middle}
.dot-green{background:var(--green)}.dot-yellow{background:var(--yellow)}.dot-red{background:var(--red)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}

/* ========== Ticker ========== */
.ticker{display:flex;align-items:baseline;gap:8px;margin:6px 0;flex-wrap:wrap}
.ticker .price{font-size:28px;font-weight:700;color:var(--text-bright);letter-spacing:-0.5px;line-height:1.1}
.ticker .change{font-size:14px;font-weight:600}
.ticker .meta{font-size:10px;color:var(--text-dim)}
@media(min-width:640px){
  .ticker .price{font-size:34px}
  .ticker .change{font-size:16px}
}

/* ========== Panel ========== */
.panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.panel-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.panel-hdr .label{color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:1.5px}
.empty{text-align:center;padding:16px;color:var(--text-dim);font-size:11px}

/* ========== Metrics ========== */
.metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
@media(min-width:480px){.metrics-grid{grid-template-columns:repeat(4,1fr)}}
.stat{text-align:center;padding:6px 4px}
.stat .val{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .sub{font-size:9px;color:var(--text-dim);margin-top:2px}
.stat .hint{font-size:9px;color:var(--text-dim)}
@media(min-width:480px){
  .stat .val{font-size:22px}
  .stat .sub,.stat .hint{font-size:10px}
}

.flex-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
@media(min-width:640px){.flex-grid{flex-direction:row}.flex-grid .panel{flex:1;min-width:0}}

/* ========== Tables ========== */
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;color:var(--text-dim);font-size:9px;text-transform:uppercase;letter-spacing:1px;padding:3px 4px;border-bottom:1px solid var(--border)}
td{padding:4px;border-bottom:1px solid rgba(30,41,59,0.4);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:hover td{background:rgba(89,194,255,0.03)}
@media(min-width:480px){
  table{font-size:12px}
  th{padding:4px 6px;font-size:10px}
  td{padding:5px 6px}
}

.trade-item{display:flex;justify-content:space-between;padding:3px 4px;border-bottom:1px solid rgba(30,41,59,0.3);font-size:10px;flex-wrap:wrap;gap:2px}
.trade-item .ta{font-weight:600}
.trade-item .tp{font-variant-numeric:tabular-nums}
.trade-item .tt{color:var(--text-dim);font-size:9px}
@media(min-width:480px){.trade-item{font-size:11px;padding:4px 6px}}

.indicators{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:10px;margin-top:4px}
.indicators span{white-space:nowrap}
@media(min-width:480px){.indicators{font-size:11px;gap:4px 16px}}

.sig{display:flex;flex-wrap:wrap;gap:3px;font-size:10px;max-height:90px;overflow-y:auto}
.sig span{background:rgba(255,255,255,0.03);padding:2px 5px;border-radius:3px;white-space:nowrap}
.sig-buy{color:var(--green)}.sig-sell{color:var(--red)}.sig-hold{color:var(--text-dim)}
@media(min-width:480px){.sig{font-size:11px;max-height:100px}.sig span{padding:2px 6px}}

/* ========== Footer ========== */
.footer{text-align:center;color:var(--text-dim);font-size:9px;padding:10px 0;border-top:1px solid var(--border);margin-top:10px}
</style>
</head>
<body>
<div class="container">

<!-- Header -->
<div class="header">
  <div class="h-top">
    <div><span class="title">CryptoQuant <span class="dim">· BTC-USDT</span></span></div>
    <div><span class="badge badge-sim" id="modeBadge">LIVE</span><span class="dim" style="margin-left:6px;font-size:10px" id="updateTime">--</span></div>
  </div>
  <div class="status-line">
    <span><span class="dot dot-green" id="statusDot"></span><span id="statusText">connecting...</span></span>
    <span id="uptimeText">--</span>
    <span id="klineCount">K#--</span>
    <span id="posBadge">📋 --</span>
  </div>
  <div class="ticker">
    <span class="price" id="priceVal">--</span>
    <span class="change" id="changeVal">--</span>
    <span class="meta" id="meta24h">H:-- L:--</span>
  </div>
</div>

<!-- Key Metrics -->
<div class="metrics-grid" id="metricsGrid">
  <div class="panel"><div class="stat"><div class="val" id="equityVal">--</div><div class="sub">Equity</div><div class="hint" id="returnVal">--</div></div></div>
  <div class="panel"><div class="stat"><div class="val" id="cashVal">--</div><div class="sub">Cash</div></div></div>
  <div class="panel"><div class="stat"><div class="val" id="pnlVal">--</div><div class="sub">PnL</div></div></div>
  <div class="panel"><div class="stat"><div class="val" id="tradesVal">--</div><div class="sub">Trades</div><div class="hint" id="winrateVal">--</div></div></div>
</div>

<!-- Position + Trades -->
<div class="flex-grid">
  <div class="panel">
    <div class="panel-hdr"><span class="label">📌 Position</span><span class="dim" style="font-size:10px" id="posCount">--</span></div>
    <div id="positionPanel"><div class="empty">Loading...</div></div>
  </div>
  <div class="panel">
    <div class="panel-hdr"><span class="label">🕐 Recent Trades</span><span class="dim" style="font-size:10px" id="tradeCount">--</span></div>
    <div id="tradesPanel"><div class="empty">Waiting...</div></div>
  </div>
</div>

<!-- Indicators -->
<div class="panel" style="margin-bottom:6px">
  <div class="panel-hdr"><span class="label">⚙️ Indicators</span></div>
  <div id="indicatorsPanel"><div class="empty">--</div></div>
</div>

<!-- OHLC K-line Chart -->
<div class="panel" style="margin-bottom:6px">
  <div class="panel-hdr"><span class="label">📈 Price Trend</span></div>
  <div id="klineBar"><div class="empty">Loading price trend...</div></div>
</div>

<!-- Signals -->
<div class="panel" style="margin-bottom:6px">
  <div class="panel-hdr"><span class="label">📡 Signals</span><span class="dim" style="font-size:10px" id="signalCount">--</span></div>
  <div id="signalsPanel"><div class="empty">Waiting...</div></div>
</div>

<div class="footer">CryptoQuant · <span id="footerTime">--</span></div>
</div>

<script>
const API = '/api/data';
let lastData = null;

async function fetchData(){
  const t = Date.now();
  try{
    const r = await fetch(API+`?_=${t}`);
    if(!r.ok) throw new Error(r.status+'');
    lastData = await r.json();
    render(lastData);
  }catch(e){
    document.getElementById('updateTime').textContent='ERR: '+e.message;
  }
}

function render(d){
  // Header
  document.getElementById('updateTime').textContent = d.updated_at||'--';
  document.getElementById('statusText').textContent = d.mode||'--';
  document.getElementById('klineCount').textContent = 'K# '+(d.kline?.is_closed?'closed':'open');
  document.getElementById('uptimeText').textContent = 'Run '+calcUptime(d.updated_at);

  // Price
  const p = d.current_price||0, cp = d.change_pct||0;
  document.getElementById('priceVal').textContent = p>0?'$'+fmt(p):'--';
  const chEl = document.getElementById('changeVal');
  chEl.textContent = (cp>=0?'+':'')+cp.toFixed(2)+'%';
  chEl.className = 'change '+(cp>=0?'green':'red');
  document.getElementById('meta24h').textContent = 'H:'+fmt(d.high_24h||0)+' L:'+fmt(d.low_24h||0);

  // Badge
  const mb = document.getElementById('modeBadge');
  mb.textContent = d.mode||'SIM';
  mb.className = 'badge '+(d.mode==='LIVE'?'badge-live':'badge-sim');

  // Position badge
  const pb = document.getElementById('posBadge');
  if(d.position){
    const side = d.position.side;
    pb.textContent = side==='long'?'📈 LONG':'📉 SHORT';
    pb.style.color = side==='long'?'var(--green)':'var(--red)';
  }else if(d.active_limit){
    pb.textContent = '⏳ '+d.active_limit.side.toUpperCase()+' PENDING';
    pb.style.color = 'var(--yellow)';
  }else{pb.textContent='🏖️ FLAT';pb.style.color='var(--text-dim)';}

  // Metrics
  const eq = d.equity||0;
  const initCap = d.initial_capital||1000;
  const retPct = ((eq - initCap)/initCap*100)||d.total_return_pct||0;
  const eqEl = document.getElementById('equityVal');
  eqEl.textContent = '$'+eq.toFixed(2);
  eqEl.style.color = retPct>=0?'var(--green)':'var(--red)';
  const rtEl = document.getElementById('returnVal');
  rtEl.textContent = (retPct>=0?'+':'')+retPct.toFixed(2)+'%';
  rtEl.style.color = retPct>=0?'var(--green)':'var(--red)';

  document.getElementById('cashVal').textContent = '$'+(d.cash||0).toFixed(2);

  const uPnl = d.position?.pnl||0;
  const pnlEl = document.getElementById('pnlVal');
  let pnlStr = (uPnl>=0?'+':'')+'$'+uPnl.toFixed(2);
  if(d.position) pnlStr += ' ('+(d.position.pnl_pct>=0?'+':'')+d.position.pnl_pct.toFixed(1)+'%)';
  pnlEl.textContent = pnlStr;
  pnlEl.style.color = uPnl>=0?'var(--green)':'var(--red)';

  document.getElementById('tradesVal').textContent = d.stats?.total_trades||0;
  document.getElementById('winrateVal').textContent = 'WR '+(d.stats?.win_rate||0)+'%';

  // Position table
  document.getElementById('posCount').textContent = d.position?'1':(d.active_limit?'Pending':'0');
  const pp = document.getElementById('positionPanel');
  if(d.position){
    const pos = d.position;
    const val = pos.size * pos.current_price;
    const marginVal = pos.margin || (pos.size * pos.entry_price / pos.leverage);
    pp.innerHTML = `<table><tr><th>Side</th><th>Size</th><th>Val</th><th>Entry</th><th>Px</th><th>Lev</th></tr><tr>
      <td class="${pos.side==='long'?'blue':'red'}" style="font-weight:600">${pos.side.toUpperCase()}</td>
      <td>${pos.size.toFixed(4)}</td>
      <td class="${pos.pnl>=0?'green':'red'}">$${fmt(val)}</td>
      <td>$${fmt(pos.entry_price)}</td>
      <td>$${fmt(pos.current_price)}</td>
      <td>${pos.leverage}x</td>
    </tr></table>${pos.margin ? `<div style="font-size:9px;color:var(--text-dim);margin-top:4px;text-align:right">Margin: $${fmt(pos.margin)}</div>` : ''}`;
  }else if(d.active_limit){
    const lo = d.active_limit;
    const sideLabel = lo.side==='buy'?'LONG':lo.side==='short_sell'?'SHORT':lo.side.toUpperCase();
    const priceVal = lo.price || lo.limit_price || 0;
    const ageStr = lo.placed_at ? `⏱ ${calcAge(lo.placed_at)}s` : '';
    pp.innerHTML = `<div style="text-align:center;padding:6px;font-size:11px">
      <span style="color:var(--yellow);font-weight:600">⏳ ${sideLabel} LIMIT PENDING</span><br>
      <span style="font-size:15px;font-weight:700;color:var(--text-bright)">$${fmt(priceVal)}</span>
      <span class="dim"> × ${lo.size||'--'} ${ageStr}</span>
    </div>`;
  }else{
    pp.innerHTML = '<div class="empty">No position 🏖️</div>';
  }

  // Trades (last 12)
  const trades = d.trades||[];
  document.getElementById('tradeCount').textContent = trades.length+'';
  const tp = document.getElementById('tradesPanel');
  if(trades.length>0){
    const recent = trades.slice(-12).reverse();
    tp.innerHTML = recent.map(t=>{
      const isEntry = t.action==='做多'||t.action==='做空';
      const pnlAmt = t.pnl || 0;
      const pnlBp = t.pnl_bp;
      let pnlStr = '';
      if(pnlBp !== undefined){
        pnlStr = (pnlBp>0?'+'+pnlBp:pnlBp)+'bp';
      } else if(pnlAmt !== 0){
        pnlStr = (pnlAmt>0?'+':'')+'$'+Math.abs(pnlAmt).toFixed(2);
      } else {
        pnlStr = '';
      }
      const pnlCls = pnlAmt>0?'green':pnlAmt<0?'red':'dim';
      return `<div class="trade-item">
        <span class="ta" style="color:${isEntry?'var(--green)':'var(--red)'}">${t.action}</span>
        <span class="tp">$${fmt(t.price)}</span>
        <span class="${pnlCls}" style="font-size:10px">${pnlStr}</span>
        <span class="tt">${(t.time||'').slice(11,19)}</span>
      </div>`;
    }).join('');
  }else{
    tp.innerHTML = '<div class="empty">No trades yet ⏳</div>';
  }

  // Indicators
  const ind = d.indicators||{};
  document.getElementById('indicatorsPanel').innerHTML = `<div class="indicators">
    <span>RSI <b class="${ind.rsi>60?'green':ind.rsi<35?'red':'dim'}">${fmt(ind.rsi)}</b></span>
    <span>ADX <b class="${ind.adx>40?'yellow':ind.adx>25?'blue':'dim'}">${fmt(ind.adx)}</b></span>
    <span>MACDh <b class="${(ind.macd_hist||0)>=0?'green':'red'}">${(ind.macd_hist||0).toFixed(1)}</b></span>
    <span>MA7 <b>$${fmt(ind.ma7)}</b></span>
    <span>MA25 <b>$${fmt(ind.ma25)}</b></span>
    <span>Price <b class="${p>=(ind.ma25||p)?'green':'red'}">${p>=(ind.ma25||p)?'↑':'↓'}</b></span>
  </div>`;

  // ===== OHLC K-line Chart =====
  renderOHLC(d);

  // Signals (last 20)
  const sigs = d.signals||[];
  document.getElementById('signalCount').textContent = sigs.length+'';
  const sp = document.getElementById('signalsPanel');
  if(sigs.length>0){
    const recent = sigs.slice(-20);
    sp.innerHTML = '<div class="sig">'+recent.map(s=>{
      const cls = s.signal==='BUY'||s.signal==='LONG'?'sig-buy':
                 s.signal==='SELL'||s.signal==='SHORT'||s.signal==='COVER'?'sig-sell':'sig-hold';
      let detail = s.time+' '+s.signal;
      if(s.long_score!==null || s.short_score!==null){
        detail += ' L='+(s.long_score||0)+' S='+(s.short_score||0);
      }
      return `<span class="${cls}">${detail}</span>`;
    }).join('')+'</div>';
  }else{
    sp.innerHTML = '<div class="empty">Waiting...</div>';
  }

  document.getElementById('footerTime').textContent = new Date().toLocaleString('zh-CN');
}

function renderOHLC(d){
  const container = document.getElementById('klineBar');
  const kh = d.kline_history||[];
  console.log('renderOHLC: bars='+kh.length);

  if(kh.length>=2){
    const valid = kh.filter(b=>b.low>0 && b.high>0);
    if(valid.length<2){container.innerHTML='<div class="empty">Waiting for price data...</div>';return;}
    console.log('renderOHLC: valid='+valid.length+', low='+valid[0].low.toFixed(1)+' high='+valid[0].high.toFixed(1));

    const bars = valid.slice(-30);
    // 强制容器可见 + 宽度回退
    container.style.display='block';
    container.style.minWidth='280px';
    const w = Math.max(container.clientWidth||0, container.parentElement?.clientWidth||0, 280);
    const h = 180;
    const pad = {t:16,b:20,l:6,r:6};
    const cw = w-pad.l-pad.r, ch = h-pad.t-pad.b;

    const allHigh = Math.max(...bars.map(b=>b.high));
    const allLow = Math.min(...bars.map(b=>b.low));
    const allRange = allHigh-allLow||1;
    const step = cw / bars.length;

    // 计算Y轴刻度
    const ticks = 5;
    const yTicks = [];
    for(let i=0;i<=ticks;i++){
      const val = allLow + (allRange*i/ticks);
      yTicks.push({val, y: pad.t + ch - (val-allLow)/allRange*ch});
    }

    // 生成K线SVG
    let lines = '';
    bars.forEach((b,i)=>{
      const x = pad.l + i*step + step*0.15;
      const bw = step*0.55;
      const ox = x + bw/2;
      const o = pad.t + ch - (b.open-allLow)/allRange*ch;
      const cl = pad.t + ch - (b.close-allLow)/allRange*ch;
      const hh = pad.t + ch - (b.high-allLow)/allRange*ch;
      const ll = pad.t + ch - (b.low-allLow)/allRange*ch;
      const isUp = b.close >= b.open;
      const col = isUp ? '#7fd962' : '#f26d78';
      // 影线
      lines += `<line x1="${ox}" y1="${hh}" x2="${ox}" y2="${ll}" stroke="${col}" stroke-width="1" stroke-opacity="0.6"/>`;
      // 实体
      const y0 = Math.min(o,cl), y1 = Math.abs(cl-o);
      lines += `<rect x="${x}" y="${y0}" width="${bw}" height="${Math.max(y1,1)}" fill="${col}" fill-opacity="0.85" rx="0.5"/>`;
      // 成交量（底部小条）
      const vol = b.volume||0;
      if(vol>0){
        const vh = Math.min(vol*3, 14);
        lines += `<rect x="${x}" y="${pad.t+ch+2}" width="${bw}" height="${vh}" fill="${col}" fill-opacity="0.15" rx="0.5"/>`;
      }
    });

    // Y轴刻度
    let yLabels = '';
    yTicks.forEach(t=>{
      yLabels += `<text x="${w-pad.r+2}" y="${t.y+3}" fill="#5c6773" font-size="9" text-anchor="start">${t.val.toFixed(0)}</text>`;
      lines += `<line x1="${pad.l}" y1="${t.y}" x2="${w-pad.r}" y2="${t.y}" stroke="#1a2332" stroke-width="0.5" stroke-dasharray="2,3"/>`;
    });

    // X轴标签（每5根）
    let xLabels = '';
    bars.forEach((b,i)=>{
      if(i%5===0||i===bars.length-1){
        const x = pad.l + i*step + step/2;
        xLabels += `<text x="${x}" y="${pad.t+ch+16}" fill="#5c6773" font-size="8" text-anchor="middle">${(b.time||'').slice(11,16)||'--'}</text>`;
      }
    });

    const lastBar = bars[bars.length-1];
    const pctChg = ((lastBar.close-bars[0].open)/bars[0].open*100);

    container.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:2px">
        <div style="display:flex;gap:10px;font-size:10px;padding:2px 0;flex-wrap:wrap">
          <span>O <b>$${fmt(lastBar.open)}</b></span>
          <span>H <b style="color:var(--green)">$${fmt(lastBar.high)}</b></span>
          <span>L <b style="color:var(--red)">$${fmt(lastBar.low)}</b></span>
          <span>C <b class="${lastBar.close>=lastBar.open?'green':'red'}">$${fmt(lastBar.close)}</b></span>
          <span class="dim">${bars.length} bars</span>
          <span class="${pctChg>=0?'green':'red'}">${pctChg>=0?'+':''}${pctChg.toFixed(2)}%</span>
        </div>
        <svg width="${w}" height="${h+20}" viewBox="0 0 ${w} ${h+20}" style="display:block;background:var(--bg);border-radius:4px">
          ${lines}
          ${yLabels}
          ${xLabels}
        </svg>
      </div>`;
  } else if(d.kline && d.kline.open > 0){
    const k = d.kline;
    container.innerHTML = `<div style="font-size:11px;padding:6px;text-align:center">
      <span class="dim">Current bar: </span>
      O=$${fmt(k.open)} H=$${fmt(k.high)} L=$${fmt(k.low)} C=$${fmt(k.close)}
      <span class="dim"> | ${k.close>=k.open?'📈':'📉'}</span>
    </div>`;
  } else {
    container.innerHTML = '<div class="empty">Waiting for price data...</div>';
  }
}

function fmt(n){return n===null||n===undefined||isNaN(n)?'--':n.toLocaleString('zh-CN',{maximumFractionDigits:2,minimumFractionDigits:0})}
function calcAge(ts){return ts?Math.floor((Date.now()/1000-ts)):0}
function calcUptime(ts){return ts?'<1d':'--';}

fetchData();
setInterval(fetchData, 3000);
</script>
</body>
</html>
